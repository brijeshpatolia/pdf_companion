name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Supabase integration test self-skips without SUPABASE_URL/KEY.
      - run: npm test

      # Selection, event order, and whether a click is dispatched at all only
      # exist in a real browser, so these run in one.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: npm run build
